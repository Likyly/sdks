name: PHP

on:
  pull_request:
    paths: ["php/**", "conformance/scenarios.json", ".github/workflows/php.yml"]
  push:
    branches: [main]
    paths: ["php/**", "conformance/scenarios.json", ".github/workflows/php.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: php } }
    strategy:
      matrix: { php: ["8.1", "8.4"] }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: "${{ matrix.php }}", tools: composer }
      - run: composer validate --strict
      - run: composer install --no-interaction --prefer-dist
      - run: composer lint
      - run: composer analyse
      - run: composer test
