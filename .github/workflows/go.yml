name: Go

on:
  pull_request:
    paths: ["go/**", "conformance/scenarios.json", ".github/workflows/go.yml"]
  push:
    branches: [main]
    paths: ["go/**", "conformance/scenarios.json", ".github/workflows/go.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: go } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.23" }
      # go/testdata/scenarios.json is the copy that ships with the mirrored module: it must match the source.
      - run: cmp testdata/scenarios.json ../conformance/scenarios.json
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race ./...
