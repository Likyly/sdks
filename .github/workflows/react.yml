name: React

# @likyly/react declares @likyly/sdk by version (what npm users install), but is tested against the SDK
# in this repository: typescript/ is built first, then linked in with `npm install --no-save ../typescript`.
on:
  pull_request:
    paths: ["react/**", "typescript/**", ".github/workflows/react.yml"]
  push:
    branches: [main]
    paths: ["react/**", "typescript/**", ".github/workflows/react.yml"]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci && npm run build
        working-directory: typescript
      - run: npm install --no-save ../typescript && npm run build && npm test && npm pack --dry-run
        working-directory: react
