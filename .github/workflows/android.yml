name: Android

on:
  pull_request:
    paths: ["android/**", "conformance/scenarios.json", ".github/workflows/android.yml"]
  push:
    branches: [main]
    paths: ["android/**", "conformance/scenarios.json", ".github/workflows/android.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: android } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test jar --no-daemon
