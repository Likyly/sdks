name: TypeScript

on:
  pull_request:
    paths: ["typescript/**", "conformance/scenarios.json", ".github/workflows/typescript.yml"]
  push:
    branches: [main]
    paths: ["typescript/**", "conformance/scenarios.json", ".github/workflows/typescript.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: typescript } }
    strategy:
      matrix: { node: [18, 22] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ matrix.node }}" }
      - run: npm ci
      - run: npm run build
      # the test runner needs Node 21+ (glob patterns); on Node 18, check the built package loads (ESM and CommonJS)
      - if: matrix.node == 22
        run: npm test
      - if: matrix.node == 18
        run: node -e "require('./dist/cjs/index.js'); import('./dist/esm/index.js').then(() => console.log('loads on', process.version))"
      - run: npm pack --dry-run
