name: Python

on:
  pull_request:
    paths: ["python/**", "conformance/scenarios.json", ".github/workflows/python.yml"]
  push:
    branches: [main]
    paths: ["python/**", "conformance/scenarios.json", ".github/workflows/python.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: python } }
    strategy:
      matrix: { python: ["3.10", "3.13"] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e ".[dev]" build
      - run: ruff check .
      - run: mypy
      - run: pytest -q
      - run: python -m build
