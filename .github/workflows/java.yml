name: Java

on:
  pull_request:
    paths: ["java/**", "conformance/scenarios.json", ".github/workflows/java.yml"]
  push:
    branches: [main]
    paths: ["java/**", "conformance/scenarios.json", ".github/workflows/java.yml"]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: java } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B verify
